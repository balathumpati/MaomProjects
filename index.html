<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Group 16 — MaOM</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f5f2ff;
    --ink-dim:#c9c0e8;
    --accent:#8fd8c4;
    --glass-bg:rgba(255,255,255,0.08);
    --glass-border:rgba(255,255,255,0.22);
    --glass-highlight:rgba(255,255,255,0.35);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 20%, #4b2e83 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #1f6f6a 0%, transparent 40%),
      radial-gradient(circle at 50% 90%, #2d1b52 0%, transparent 50%),
      linear-gradient(160deg, #140a26 0%, #1b1038 45%, #0f1a2e 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    position:relative;
  }
  .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.5;
    z-index:0;
    pointer-events:none;
    animation:drift 22s ease-in-out infinite;
  }
  .orb1{width:340px;height:340px;background:#7c5cff;top:-80px;left:-100px;animation-delay:0s;}
  .orb2{width:280px;height:280px;background:#33cbb0;bottom:-60px;right:-60px;animation-delay:-8s;}
  .orb3{width:220px;height:220px;background:#ff8f6b;top:40%;left:60%;animation-delay:-14s;opacity:0.3;}
  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(30px,-40px) scale(1.08);}
  }
  @media (prefers-reduced-motion:reduce){ .orb{animation:none;} }

  header{position:relative;z-index:1;text-align:center;padding:3.2rem 1.5rem 3rem;}
  .uni-bar{
    display:flex;align-items:center;justify-content:center;gap:0.7rem;
    margin-bottom:2.2rem;
  }
  .uni-logo{height:44px;width:auto;display:block;}
  .uni-name{
    font-family:'Fraunces',serif;font-weight:500;font-size:1.15rem;
    color:var(--ink);letter-spacing:0.01em;
  }
  .eyebrow{font-size:0.85rem;letter-spacing:0.02em;color:var(--ink-dim);margin:0 0 0.6rem;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(2.4rem,6vw,4.2rem);margin:0 0 0.4rem;letter-spacing:-0.01em;}
  .section-tag{
    display:inline-block;margin-top:0.8rem;padding:0.35rem 1.1rem;font-size:0.9rem;
    background:var(--glass-bg);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;
  }

  main{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:0 1.5rem 6rem;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.6rem;}
  .status{grid-column:1/-1;text-align:center;color:var(--ink-dim);padding:2rem 0;}

  .card{
    background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:24px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:inset 0 1px 0 var(--glass-highlight), 0 8px 32px rgba(0,0,0,0.35);
    overflow:hidden;cursor:pointer;
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1), box-shadow 0.35s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 var(--glass-highlight), 0 16px 40px rgba(0,0,0,0.45);}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .card-media{width:100%;aspect-ratio:4/3;overflow:hidden;background:rgba(255,255,255,0.05);}
  .card-media img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-body{padding:1.3rem 1.4rem 1.5rem;}
  .card-body h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.35rem;margin:0 0 0.35rem;}
  .card-body p{margin:0;font-size:0.92rem;line-height:1.5;color:var(--ink-dim);}
  .view-more{display:inline-block;margin-top:0.9rem;font-size:0.85rem;color:var(--accent);}

  .card.placeholder{
    cursor:default;display:flex;align-items:center;justify-content:center;
    min-height:260px;border-style:dashed;
  }
  .card.placeholder:hover{transform:none;}
  .card.placeholder p{text-align:center;color:var(--ink-dim);font-size:0.95rem;padding:2rem;}

  .team-section{margin-top:3.5rem;}
  .team-heading{
    font-family:'Fraunces',serif;font-weight:500;font-size:1.5rem;
    margin:0 0 1.1rem;text-align:center;
  }
  .team-card{
    background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:24px;
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:inset 0 1px 0 var(--glass-highlight), 0 8px 32px rgba(0,0,0,0.35);
    padding:0.6rem 1.6rem;
  }
  .team-list{list-style:none;margin:0;padding:0;}
  .team-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:0.9rem 0;font-size:1rem;
  }
  .team-list li + li{border-top:1px solid rgba(255,255,255,0.12);}
  .team-name{color:var(--ink);}
  .team-role{color:var(--ink-dim);font-size:0.88rem;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,6,20,0.6);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:1.5rem;z-index:10;
    opacity:0;pointer-events:none;transition:opacity 0.3s ease;
  }
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{
    max-width:640px;width:100%;max-height:88vh;overflow-y:auto;
    background:rgba(30,20,55,0.75);border:1px solid var(--glass-border);border-radius:28px;
    backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
    box-shadow:inset 0 1px 0 var(--glass-highlight), 0 24px 60px rgba(0,0,0,0.5);
    transform:scale(0.94) translateY(10px);
    transition:transform 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .modal-backdrop.open .modal{transform:scale(1) translateY(0);}
  .modal-media img{width:100%;display:block;max-height:52vh;object-fit:contain;background:rgba(0,0,0,0.2);}
  .modal-body{padding:1.6rem 1.8rem 2rem;}
  .modal-body h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.7rem;margin:0 0 0.3rem;}
  .modal-meta{font-size:0.85rem;color:var(--ink-dim);margin:0 0 1rem;}
  .modal-body p{font-size:0.98rem;line-height:1.65;color:var(--ink);margin:0 0 0.9rem;}
  .close-btn{
    position:sticky;top:0.9rem;float:right;margin:0.9rem 0.9rem 0 0;
    width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-border);
    background:rgba(255,255,255,0.1);color:var(--ink);font-size:1.1rem;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .close-btn:hover{background:rgba(255,255,255,0.2);}

  footer{position:relative;z-index:1;text-align:center;padding:2rem 1.5rem 3rem;color:var(--ink-dim);font-size:0.82rem;}

  @media (max-width:480px){
    header{padding:2.4rem 1.2rem 2.4rem;}
    .uni-logo{height:34px;}
    .uni-name{font-size:0.95rem;}
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<header>
  <div class="uni-bar">
    <img src="assets/amritalogo.png" alt="Amrita Vishwa Vidyapeetham logo" class="uni-logo">
    <span class="uni-name">Amrita Vishwa Vidyapeetham</span>
  </div>
  <p class="eyebrow">Team project archive</p>
  <h1>Group 16 — MaOM</h1>
  <span class="section-tag">CSE-H</span>
</header>

<main>
  <div class="grid" id="grid">
    <p class="status">Loading projects…</p>
  </div>

  <section class="team-section">
    <h2 class="team-heading">Team details</h2>
    <div class="team-card">
      <ul class="team-list" id="teamList">
        <li class="status">Loading team…</li>
      </ul>
    </div>
  </section>
</main>

<footer>Group 16 · MaOM · CSE-H</footer>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="close-btn" id="closeBtn" aria-label="Close">✕</button>
    <div class="modal-media"><img id="modalImg" src="" alt=""></div>
    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <p class="modal-meta">MaOM · Group 16 · CSE-H</p>
      <p id="modalDesc"></p>
    </div>
  </div>
</div>

<script>
  const grid = document.getElementById('grid');
  const backdrop = document.getElementById('modalBackdrop');
  const closeBtn = document.getElementById('closeBtn');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const modalDesc = document.getElementById('modalDesc');

  function openModal(project){
    modalImg.src = project.image;
    modalImg.alt = project.title;
    modalTitle.textContent = project.title;
    modalDesc.textContent = project.description || project.summary || '';
    backdrop.classList.add('open');
  }
  function closeModal(){ backdrop.classList.remove('open'); }
  closeBtn.addEventListener('click', closeModal);
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

  function renderProjects(projects){
    grid.innerHTML = '';
    if(!projects.length){
      grid.innerHTML = '<p class="status">No projects yet — add one to assets/projects/projects.json.</p>';
      return;
    }
    projects.forEach((project, i)=>{
      const card = document.createElement('article');
      card.className = 'card';
      card.tabIndex = 0;
      card.setAttribute('role','button');
      card.setAttribute('aria-label', 'Open ' + project.title + ' project');
      card.innerHTML = `
        <div class="card-media"><img src="${project.image}" alt="${project.title}"></div>
        <div class="card-body">
          <h2>${project.title}</h2>
          <p>${project.summary || ''}</p>
          <span class="view-more">View more →</span>
        </div>`;
      const open = ()=> openModal(project);
      card.addEventListener('click', open);
      card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
      grid.appendChild(card);
    });
    const placeholder = document.createElement('div');
    placeholder.className = 'card placeholder';
    placeholder.innerHTML = '<p>More projects will appear here as the team adds them.</p>';
    grid.appendChild(placeholder);
  }

  fetch('assets/projects/projects.json')
    .then(res => {
      if(!res.ok) throw new Error('Could not load projects.json');
      return res.json();
    })
    .then(renderProjects)
    .catch(err => {
      grid.innerHTML = '<p class="status">Could not load projects. If you\'re viewing this file directly (file://), '
        + 'run a local server, or push it to GitHub Pages, where it will load normally.</p>';
      console.error(err);
    });

  const teamList = document.getElementById('teamList');
  function renderTeam(members){
    teamList.innerHTML = '';
    if(!members.length){
      teamList.innerHTML = '<li class="status">No team members listed yet.</li>';
      return;
    }
    members.forEach(member=>{
      const li = document.createElement('li');
      li.innerHTML = `<span class="team-name">${member.name}</span>`
        + (member.role ? `<span class="team-role">${member.role}</span>` : '');
      teamList.appendChild(li);
    });
  }
  fetch('assets/team/team.json')
    .then(res => {
      if(!res.ok) throw new Error('Could not load team.json');
      return res.json();
    })
    .then(renderTeam)
    .catch(err => {
      teamList.innerHTML = '<li class="status">Could not load team details.</li>';
      console.error(err);
    });
</script>

</body>
</html>
